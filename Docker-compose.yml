services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - 'POSTGRES_DB=msdb'
      - 'POSTGRES_PASSWORD=postgres'    
      - 'POSTGRES_USER=postgres'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build:
      context: .
    container_name: MS-API
    healthcheck:
      test: ["executable", "arg"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      - spring.profiles.active=local
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: