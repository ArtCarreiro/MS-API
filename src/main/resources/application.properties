spring.application.name=api

# Ambiente
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Banco de Dados
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximumPoolSize=5

# Session
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.generate-ddl=false

supabase.storage.endpoint=https://wsqkqqykmkdfhdyvucqk.storage.supabase.co/storage/v1/s3
supabase.storage.region=us-west-1
supabase.storage.access-key=ae110d748ec154d41836a1027da56376
supabase.storage.secret-key=00eb614c38155346ca0c3e354808550f22923e954910172b50f140213d08a85b
supabase.storage.bucket=ms-bucket-s3
supabase.project-ref=MS-API


# Jackson
spring.jackson.default-property-inclusion=non_null

# Logs Hibernate (silenciar)
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.engine.transaction.internal=OFF

# Logs Spring (opcional mais limpo)
logging.level.org.springframework=WARN